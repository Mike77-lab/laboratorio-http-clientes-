<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Laboratorio HTTP y Big Data</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 16px; }
    input, button { padding: 8px; margin: 5px 0; }
    li { margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Panel de Clientes (Frontend)</h1>
  <button id="cargar">Cargar Lista de Clientes (GET)</button>
  <ul id="lista"></ul>

  <h2>Crear Nuevo Cliente (POST)</h2>
  <input id="nombre" placeholder="Nombre completo"><br>
  <input id="correo" placeholder="Correo electrónico"><br>
  <button id="crear">Guardar Cliente</button>

  <script>
    async function cargar() {
      const res = await fetch('/api/clientes');
      const datos = await res.json();
      const lista = document.getElementById('lista');
      lista.innerHTML = '';
      datos.forEach(c => {
        const li = document.createElement('li');
        li.textContent = `${c.id} - ${c.nombre} (${c.correo}) `;
        const btn = document.createElement('button');
        btn.textContent = 'Eliminar';
        btn.onclick = async () => {
          await fetch(`/api/clientes/${c.id}`, { method: 'DELETE' });
          cargar();
        };
        li.appendChild(btn);
        lista.appendChild(li);
      });
    }

    document.getElementById('cargar').onclick = cargar;
    document.getElementById('crear').onclick = async () => {
      const nombre = document.getElementById('nombre').value;
      const correo = document.getElementById('correo').value;
      await fetch('/api/clientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, correo })
      });
      cargar();
    };
    cargar();
  </script>
</body>
</html>
